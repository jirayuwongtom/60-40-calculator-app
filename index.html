<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณสิทธิ์ 60/40</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>เครื่องคำนวณสิทธิ์ 60/40</h1>
    <p class="subtitle">รัฐช่วย 60% • เราจ่าย 40%</p>

    <div class="info">
        <div class="info-box government">
            รัฐช่วย
            <strong>60%</strong>
        </div>
        <div class="info-box user">
            เราจ่าย
            <strong>40%</strong>
        </div>
    </div>

    <label for="remaining">
        สิทธิ์ที่เหลือ (บาท)
    </label>
    <input
        type="number"
        id="remaining"
        placeholder="เช่น 100"
        min="0"
        step="0.01"
    >

    <label for="price">
        ราคาสินค้า / ข้าว (บาท)
    </label>
    <input
        type="number"
        id="price"
        placeholder="เช่น 30"
        min="0"
        step="0.01"
    >

    <button class="calculate-btn" onclick="calculate()">
        คำนวณ
    </button>

    <button class="reset-btn" onclick="resetCalculator()">
        ล้างข้อมูล
    </button>

    <div id="warning" class="warning"></div>

    <div id="result" class="result">
        <div class="result-header">
            ผลการคำนวณ
        </div>
        <div class="result-row">
            <span>ราคาสินค้า</span>
            <span id="totalPrice">0.00 บาท</span>
        </div>
        <div class="result-row">
            <span>รัฐช่วย 60%</span>
            <span id="governmentPay">0.00 บาท</span>
        </div>
        <div class="result-row highlight">
            <span>เราจ่าย 40%</span>
            <span id="userPay">0.00 บาท</span>
        </div>
        <div class="result-row remaining">
            <span>สิทธิ์คงเหลือ</span>
            <span id="remainingAfter">0.00 บาท</span>
        </div>
        <div id="maxPurchaseBox" class="max-purchase" style="display: none;">
            ซื้อได้อีกสูงสุดเพื่อใช้สิทธิ์ให้หมดพอดี
        <strong id="maxPurchaseAmount">0.00 บาท</strong>
        </div>
    </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
