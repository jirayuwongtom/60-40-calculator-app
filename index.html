<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {

        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;

        color: #2563eb;

    .user {
        color: #16a34a;
    }

    label {
        display: block;

        color: #333;
        font-weight: bold;
    }

    input {
        width: 100%;

        border: 2px solid #ddd;

    input:focus {

    button {

        display: flex;

    .result-row span:last-child {

        font-size: 19px;

    .warning {
        background: #fff7ed;
        color: #c2410c;

        margin-top: 15px;

        text-align: center;

    }

    .remaining {

    .max-purchase strong {

    }

</head>

<body>

<div class="container">

```
<h1>เครื่องคำนวณสิทธิ์ 60/40</h1>
<p class="subtitle">รัฐช่วย 60% • เราจ่าย 40%</p>

<div class="info">
    <div class="info-box government">
        รัฐช่วย
        <strong>60%</strong>
    </div>

    <div class="info-box user">
        เราจ่าย
        <strong>40%</strong>
    </div>
</div>

<label for="remaining">
    สิทธิ์ที่เหลือ (บาท)
</label>

<input
    type="number"
    id="remaining"
    placeholder="เช่น 120"
    min="0"
    step="0.01"
>

<label for="price">
    ราคาสินค้า / ข้าว (บาท)
</label>

<input
    type="number"
    id="price"
    placeholder="เช่น 90"
    min="0"
    step="0.01"
>

<button class="calculate-btn" onclick="calculate()">
    คำนวณ
</button>

<button class="reset-btn" onclick="resetCalculator()">
    ล้างข้อมูล
</button>

<div id="warning" class="warning"></div>

<div id="result" class="result">

    <div class="result-header">
        ผลการคำนวณ
    </div>

    <div class="result-row">
        <span>ราคาสินค้า</span>
        <span id="totalPrice">0.00 บาท</span>
    </div>

    <div class="result-row">
        <span>รัฐช่วย 60%</span>
        <span id="governmentPay">0.00 บาท</span>
    </div>

    <div class="result-row highlight">
        <span>เราจ่าย 40%</span>
        <span id="userPay">0.00 บาท</span>
    </div>

    <div class="result-row remaining">
        <span>สิทธิ์คงเหลือ</span>
        <span id="remainingAfter">0.00 บาท</span>
    </div>

</div>

<div class="footer">
    เครื่องคำนวณ 60/40
</div>
```

</div>

<script>
    function calculate() {

        const remaining = parseFloat(
            document.getElementById("remaining").value
        );

        const price = parseFloat(
            document.getElementById("price").value
        );

        const warning = document.getElementById("warning");
        const result = document.getElementById("result");
        

        warning.style.display = "none";
        result.style.display = "none";
       

        // ตรวจสอบข้อมูล
        if (isNaN(remaining) || isNaN(price)) {
            warning.innerText = "กรุณากรอกข้อมูลให้ครบ";
            warning.style.display = "block";
            return;
        }

        if (remaining < 0 || price < 0) {
            warning.innerText = "กรุณาใส่จำนวนเงินที่มากกว่าหรือเท่ากับ 0";
            warning.style.display = "block";
            return;
        }

        // รัฐช่วย 60%
        const government = price * 0.60;

        // เราจ่าย 40%
        const user = price * 0.40;

        // สิทธิ์คงเหลือ
        const after = remaining - government;

        // ถ้าสิทธิ์ไม่พอ
        if (government > remaining) {

            warning.innerText =
                "สิทธิ์ไม่พอสำหรับการซื้อจำนวนนี้";

            warning.style.display = "block";

            

            return;
        }

        // แสดงผล
        document.getElementById("totalPrice").innerText =
            formatMoney(price) + " บาท";

        document.getElementById("governmentPay").innerText =
            formatMoney(government) + " บาท";

        document.getElementById("userPay").innerText =
            formatMoney(user) + " บาท";

        document.getElementById("remainingAfter").innerText =
            formatMoney(after) + " บาท";

        result.style.display = "block";

        
    }


    function formatMoney(number) {
        return number.toLocaleString("th-TH", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }


    function resetCalculator() {

        document.getElementById("remaining").value = "";
        document.getElementById("price").value = "";

        document.getElementById("warning").style.display = "none";
        document.getElementById("result").style.display = "none";
        
    }


    // กด Enter เพื่อคำนวณ
    document.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            calculate();
        }

    });
</script>

</body>
